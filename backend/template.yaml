AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PulseChain — Unified Blood Response & Wastage Prevention Network

Parameters:
  DemoMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable demo mode with shortened expiry thresholds
  ExistingTableName:
    Type: String
    Default: ""
    Description: Name of existing DynamoDB table (leave empty to create table)
  SesFromEmail:
    Type: String
    Default: ""
    Description: Verified SES email address for sending offer notifications (optional)

Conditions:
  CreateTable: !Equals [!Ref ExistingTableName, ""]
  HasSesFrom: !Not [!Equals [!Ref SesFromEmail, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE_NAME: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
        DEMO_MODE: !Ref DemoMode
        SES_FROM: !Ref SesFromEmail
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB Table
  # ---------------------------------------------------------------------------
  PulseChainTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTable
    Properties:
      TableName: PulseChain
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: pulsechain

  # ---------------------------------------------------------------------------
  # HTTP API Gateway
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-facility-id
          - x-role

  # ---------------------------------------------------------------------------
  # API Lambdas
  # ---------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/demo.health
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/demo.ts

  FacilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/facilities.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        GetFacilities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /facilities
            Method: GET
        GetFacilityById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /facilities/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/facilities.ts

  UnitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/units.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        PostUnits:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /units
            Method: POST
        GetStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /facilities/{id}/stock
            Method: GET
        GetUnitById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /units/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/units.ts

  RequisitionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/requisitions.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        PostRequisitions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requisitions
            Method: POST
        GetRequisitions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requisitions
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/requisitions.ts

  OffersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/offers.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        GetInbox:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /inbox
            Method: GET
        GetOffers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /offers
            Method: GET
        ClaimOffer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /offers/{id}/claim
            Method: POST
        DeclineOffer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /offers/{id}/decline
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/offers.ts

  TransfersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/transfers.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        InTransit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /units/{id}/in-transit
            Method: POST
        Received:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /units/{id}/received
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/transfers.ts

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/dashboard.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        GetDashboardImpact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dashboard/impact
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/dashboard.ts

  ParseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/parse.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
      Events:
        ParseRequisition:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requisitions/parse
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/parse.ts

  EscalationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api/escalations.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
      Events:
        GetActiveEscalations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /escalations/active
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/escalations.ts

  # ---------------------------------------------------------------------------
  # Worker Lambdas (Step Functions & EventBridge tasks)
  # ---------------------------------------------------------------------------
  MatchRingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/match-ring.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/match-ring.ts

  CreateOffersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/create-offers.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/create-offers.ts

  CheckOffersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/check-offers.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/check-offers.ts

  FinishEscalationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/finish-escalation.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/finish-escalation.ts

  LostCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/lost-check.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/lost-check.ts

  DonorTierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/donor-tier.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/donor-tier.ts

  SweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/workers/sweep.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref EscalationStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt EscalationStateMachine.Name
      Events:
        SweepSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: PulseChainSweepSchedule
            Description: Periodic sweep for near-expiry blood units
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/workers/sweep.ts

  # ---------------------------------------------------------------------------
  # Step Functions State Machine
  # ---------------------------------------------------------------------------
  EscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/escalation.asl.json
      DefinitionSubstitutions:
        MatchRingFunctionArn: !GetAtt MatchRingFunction.Arn
        CreateOffersFunctionArn: !GetAtt CreateOffersFunction.Arn
        CheckOffersFunctionArn: !GetAtt CheckOffersFunction.Arn
        FinishEscalationFunctionArn: !GetAtt FinishEscalationFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MatchRingFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CreateOffersFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckOffersFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinishEscalationFunction

Outputs:
  ApiUrl:
    Description: PulseChain HTTP API Gateway URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Description: DynamoDB Table Name
    Value: !If [CreateTable, !Ref PulseChainTable, !Ref ExistingTableName]
  StateMachineArn:
    Description: Escalation State Machine ARN
    Value: !Ref EscalationStateMachine
